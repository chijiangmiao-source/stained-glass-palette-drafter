services:
  # 发布页面：静态托管构建产物，宿主端口可用 WEB_PORT 覆盖
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # 一次性验收：运行 Vitest 与 Playwright 后即退出
  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://web:80
      CI: "1"
